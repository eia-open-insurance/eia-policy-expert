name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository baseline
        run: |
          test -f README.md
          test -f .github/CODEOWNERS
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f CHANGELOG.md
          test -f .editorconfig

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
      - name: Build if Maven project
        run: |
          if [ -f pom.xml ]; then
            mvn -B -ntp verify
          else
            echo "No pom.xml yet; baseline only."
          fi

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build if Node project
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npm run build --if-present
            npm test --if-present
          else
            echo "No package.json yet; baseline only."
          fi
