spring:
  datasource:
    url: jdbc:h2:mem:eia_policy_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  quartz:
    auto-startup: false
    job-store-type: memory
eia:
  outbox:
    enabled: false
