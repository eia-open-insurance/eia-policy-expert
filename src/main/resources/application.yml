server:
  port: 8083
spring:
  application:
    name: eia-policy-expert
  datasource:
    url: jdbc:postgresql://localhost:5432/eia_policy
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
  sql:
    init:
      mode: always
  quartz:
    auto-startup: ${eia.outbox.enabled:false}
    job-store-type: memory
management:
  endpoints:
    web:
      exposure:
        include: health,info
eia:
  product:
    seed:
      enabled: ${EIA_PRODUCT_SEED_ENABLED:true}
  outbox:
    enabled: ${EIA_OUTBOX_ENABLED:false}
    endpoint: ${EIA_OUTBOX_ENDPOINT:}
    batch-size: ${EIA_OUTBOX_BATCH_SIZE:100}
    max-attempts: ${EIA_OUTBOX_MAX_ATTEMPTS:12}
    claim-lease: ${EIA_OUTBOX_CLAIM_LEASE:2m}
    interval: ${EIA_OUTBOX_INTERVAL:2s}
    signing-secret: ${EIA_OUTBOX_SIGNING_SECRET:}
